<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rwanda Farm Market</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f2;color:#222}
header{background:#198754;color:#fff;text-align:center;padding:30px 15px}
header h1{margin:0;font-size:34px}
header p{font-size:18px}
.container{max-width:1000px;margin:auto;padding:20px}
h2{margin-top:25px}
.search{width:100%;padding:15px;border:1px solid #ccc;border-radius:9px;font-size:16px;margin-bottom:20px}
.form{background:#fff;padding:20px;border-radius:14px;box-shadow:0 2px 10px #0002;margin-bottom:30px}
.form input,.form textarea,.form select{width:100%;padding:13px;margin:7px 0 12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.form textarea{min-height:90px;resize:vertical}
button,.contact{background:#198754;color:#fff;border:0;padding:12px 18px;border-radius:7px;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.contact:hover{background:#146c43}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0002}
.card img{width:100%;height:190px;object-fit:cover;background:#eee}
.card-content{padding:18px}
.card h3{color:#198754;margin-top:0}
.price{font-weight:bold;font-size:19px}
.location{color:#555}
.empty{text-align:center;background:#fff;padding:25px;border-radius:12px}
small{color:#666}
footer{text-align:center;background:#222;color:#fff;padding:25px;margin-top:35px}
.remove{background:#dc3545;margin-left:6px}
@media(max-width:500px){header h1{font-size:29px}.container{padding:15px}}
</style>
</head>
<body>

<header>
<h1>🇷🇼 Rwanda Farm Market</h1>
<p>Buy and sell agricultural and livestock products in Rwanda</p>
</header>

<div class="container">

<section class="form">
<h2>➕ Add Your Product</h2>
<p>Farmers and livestock owners can list products for buyers.</p>

<label>Product name</label>
<input id="name" type="text" placeholder="Example: Pekin ducks">

<label>Category</label>
<select id="category">
<option>Livestock</option>
<option>Poultry</option>
<option>Rabbits</option>
<option>Crops</option>
<option>Vegetables</option>
<option>Fruits</option>
<option>Other</option>
</select>

<label>Price (RWF)</label>
<input id="price" type="number" placeholder="Example: 15000">

<label>Location</label>
<input id="location" type="text" placeholder="Example: Ruhango, Rwanda">

<label>Phone / WhatsApp number</label>
<input id="phone" type="tel" placeholder="Example: 0780000000">

<label>Product description</label>
<textarea id="description" placeholder="Describe your product..."></textarea>

<label>Product photo</label>
<input id="image" type="file" accept="image/*">

<button onclick="addProduct()">Publish Product</button>
</section>

<h2>🔎 Find Farm Products</h2>
<input class="search" id="search" type="text"
placeholder="Search chickens, rabbits, ducks, vegetables..."
oninput="displayProducts()">

<div id="products" class="products"></div>

</div>

<footer>
<p>© 2026 Rwanda Farm Market 🇷🇼</p>
<p>Connecting farmers with buyers in Rwanda</p>
</footer>

<script>
let products = JSON.parse(localStorage.getItem("farmProducts") || "[]");

function addProduct(){
  const name=document.getElementById("name").value.trim();
  const category=document.getElementById("category").value;
  const price=document.getElementById("price").value.trim();
  const location=document.getElementById("location").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const description=document.getElementById("description").value.trim();
  const imageFile=document.getElementById("image").files[0];

  if(!name || !price || !location || !phone){
    alert("Please fill in product name, price, location and phone number.");
    return;
  }

  const saveProduct=(image)=>{
    products.unshift({
      id:Date.now(),
      name,category,price,location,phone,
      description:description || "No description provided.",
      image:image || ""
    });
    localStorage.setItem("farmProducts",JSON.stringify(products));
    document.querySelector(".form").scrollIntoView({behavior:"smooth"});
    document.getElementById("name").value="";
    document.getElementById("price").value="";
    document.getElementById("location").value="";
    document.getElementById("phone").value="";
    document.getElementById("description").value="";
    document.getElementById("image").value="";
    alert("Product published successfully!");
    displayProducts();
  };

  if(imageFile){
    const reader=new FileReader();
    reader.onload=()=>saveProduct(reader.result);
    reader.readAsDataURL(imageFile);
  }else{
    saveProduct("");
  }
}

function whatsappLink(phone,name){
  let number=phone.replace(/\D/g,"");
  if(number.startsWith("0")) number="250"+number.substring(1);
  if(!number.startsWith("250")) number="250"+number;
  return "https://wa.me/"+number+"?text="+encodeURIComponent(
    "Hello, I am interested in your "+name+" listed on Rwanda Farm Market."
  );
}

function displayProducts(){
  const box=document.getElementById("products");
  const search=document.getElementById("search").value.toLowerCase().trim();

  const filtered=products.filter(p=>
    (p.name+" "+p.category+" "+p.location+" "+p.description)
    .toLowerCase().includes(search)
  );

  if(filtered.length===0){
    box.innerHTML='<div class="empty">No products found yet. Add the first product above.</div>';
    return;
  }

  box.innerHTML=filtered.map(p=>`
    <div class="card">
      ${p.image ? `<img src="${p.image}" alt="${escapeHtml(p.name)}">` : ""}
      <div class="card-content">
        <h3>${escapeHtml(p.name)}</h3>
        <small>${escapeHtml(p.category)}</small>
        <p class="price">${Number(p.price).toLocaleString()} RWF</p>
        <p class="location">📍 ${escapeHtml(p.location)}</p>
        <p>${escapeHtml(p.description)}</p>
        <a class="contact" href="${whatsappLink(p.phone,p.name)}" target="_blank">💬 WhatsApp Seller</a>
        <a class="contact" href="tel:${escapeHtml(p.phone)}">📞 Call Seller</a>
        <button class="remove" onclick="removeProduct(${p.id})">Delete</button>
      </div>
    </div>
  `).join("");
}

function removeProduct(id){
  if(confirm("Delete this product?")){
    products=products.filter(p=>p.id!==id);
    localStorage.setItem("farmProducts",JSON.stringify(products));
    displayProducts();
  }
}

function escapeHtml(text){
  return String(text).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

displayProducts();
</script>

</body>
</html>
