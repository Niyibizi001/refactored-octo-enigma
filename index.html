<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rwanda Farm Market</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7f2;color:#222}header{background:#176b3a;color:#fff;padding:24px;text-align:center}.container{max-width:1000px;margin:auto;padding:20px}.box,.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px #0002}.box{padding:20px;margin-bottom:20px}input,select,textarea,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:7px}button{background:#176b3a;color:#fff;border:0;font-weight:bold;cursor:pointer}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.card{overflow:hidden}.card img{width:100%;height:190px;object-fit:cover}.content{padding:15px}.price{color:#176b3a;font-size:20px;font-weight:bold}.actions{display:flex;gap:8px}.actions button{flex:1}.whatsapp{background:#168b45}.delete{background:#b52b2b}.small{color:#666;font-size:14px}label{font-weight:bold}
</style>
</head>
<body>
<header><h1>🌾 Rwanda Farm Market</h1><p>Buy and sell agricultural and livestock products in Rwanda</p></header>
<div class="container">
<div class="box"><h2>🔎 Find Farm Products</h2><input id="search" placeholder="Search products, category or location..." oninput="showProducts()"></div>
<div class="box"><h2>➕ Add Your Product</h2>
<form id="form">
<label>Product name</label><input id="name" required placeholder="Example: Pekin Ducks">
<label>Category</label><select id="category" required><option value="">Select category</option><option>Livestock</option><option>Poultry</option><option>Rabbits</option><option>Crops</option><option>Vegetables</option><option>Fruits</option><option>Animal feed</option><option>Other</option></select>
<label>Price (RWF)</label><input id="price" type="number" required placeholder="Example: 15000">
<label>Location</label><input id="location" required placeholder="Example: Ruhango, Rwanda">
<label>Phone / WhatsApp</label><input id="phone" required placeholder="078xxxxxxx">
<label>Description</label><textarea id="description" rows="3" placeholder="Describe your product..."></textarea>
<label>Product photo</label><input id="photo" type="file" accept="image/*">
<button type="submit">Publish Product</button></form><p id="message"></p></div>
<h2>🛒 Available Products</h2><div id="products" class="products"></div>
</div>
<script>
let products=JSON.parse(localStorage.getItem('rwandaFarmProducts')||'[]');
function save(){localStorage.setItem('rwandaFarmProducts',JSON.stringify(products))}
function showProducts(){const q=document.getElementById('search').value.toLowerCase();const area=document.getElementById('products');area.innerHTML='';const list=products.filter(p=>(p.name+' '+p.category+' '+p.location).toLowerCase().includes(q));if(!list.length){area.innerHTML='<div class="box">No products found. Be the first seller!</div>';return}list.forEach(p=>{const c=document.createElement('div');c.className='card';c.innerHTML=(p.photo?'<img src="'+p.photo+'" alt="product">':'')+'<div class="content"><h3>'+p.name+'</h3><p class="price">'+Number(p.price).toLocaleString()+' RWF</p><p><b>Category:</b> '+p.category+'</p><p><b>Location:</b> '+p.location+'</p><p>'+p.description+'</p><p class="small">Seller: '+p.phone+'</p><div class="actions"><button class="whatsapp" onclick="wa(\''+p.phone+'\')">WhatsApp</button><button onclick="callSeller(\''+p.phone+'\')">Call</button></div><button class="delete" onclick="del('+p.id+')">Delete</button></div>';area.appendChild(c)})}
function wa(phone){let n=phone.replace(/\D/g,'');if(n.startsWith('0'))n='250'+n.slice(1);window.open('https://wa.me/'+n,'_blank')}
function callSeller(phone){window.location.href='tel:'+phone}
function del(id){if(confirm('Delete this product?')){products=products.filter(p=>p.id!==id);save();showProducts()}}
document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();const f=document.getElementById('photo').files[0];const add=photo=>{products.unshift({id:Date.now(),name:document.getElementById('name').value,category:document.getElementById('category').value,price:document.getElementById('price').value,location:document.getElementById('location').value,phone:document.getElementById('phone').value,description:document.getElementById('description').value,photo:photo});save();this.reset();document.getElementById('message').textContent='Product published successfully!';showProducts()};if(f){const r=new FileReader();r.onload=()=>add(r.result);r.readAsDataURL(f)}else add('')});showProducts();
</script>
</body>
</html>
